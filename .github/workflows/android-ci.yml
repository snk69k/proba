name: Android build and tests

on:
  push:
    branches:
      - rsreu-schedule-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify Android project sources
        shell: bash
        run: |
          cat ci/bundle.part* > /tmp/rsreu_schedule_bundle.b64
          base64 --decode /tmp/rsreu_schedule_bundle.b64 > /tmp/rsreu_schedule_source.tar.gz
          echo "5d9ca4ff54b428ec6e2f22fbddc1cd9e4e900083dfccb853de5443379452c648  /tmp/rsreu_schedule_source.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/rsreu_schedule_source.tar.gz
          test -f app/src/main/java/ru/rsreu/schedule/MainActivity.kt
          test -f app/src/test/java/ru/rsreu/schedule/data/ScheduleParserTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify live RSREU source structure
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import time
          import urllib.parse
          import urllib.request

          base = "https://rasp.rsreu.ru/schedule-frame/group"
          headers = {"User-Agent": "RSREU-Schedule-Android/0.1 (CI compatibility test)"}

          def fetch(params):
              url = base + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 200
                  return response.read().decode("utf-8", errors="replace")

          group_page = fetch({"faculty": 1, "group": 2206})
          assert 'name="group"' in group_page
          assert ':options=' in group_page
          assert '"value":2206' in html.unescape(group_page)

          select = re.search(r'<select\s+name="date"[^>]*>(.*?)</select>', group_page, re.S | re.I)
          assert select, "Week selector not found"
          weeks = re.findall(r'<option\s+value="(\d{4}-\d{2}-\d{2})"', select.group(1), re.I)
          assert weeks, "No week values found"

          found_table = False
          found_lesson = False
          for week in weeks:
              page = fetch({"faculty": 1, "group": 2206, "date": week})
              found_table = found_table or "table-vertical-borders" in page
              found_lesson = found_lesson or "schedule-cell" in page
              if found_table and found_lesson:
                  print(f"Compatible populated schedule found for week {week}")
                  break
              time.sleep(0.2)

          assert found_table, "Schedule table marker not found"
          assert found_lesson, "No populated lesson cell found in available weeks"
          PY

      - name: Unit tests, lint and APK build
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UI smoke test on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Prepare distributable APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/RSREU-Schedule-v0.1.0-test.apk
          cp /tmp/rsreu_schedule_source.tar.gz \
            dist/RSREU-Schedule-source-v0.1.0.tar.gz
          cd dist
          sha256sum RSREU-Schedule-v0.1.0-test.apk \
            > RSREU-Schedule-v0.1.0-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rsreu-schedule-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
