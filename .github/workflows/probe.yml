name: Probe RSREU lecturer schedule

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect lecturer schedule HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request

          base = 'https://rasp.rsreu.ru/schedule-frame/lecturer'
          params = urllib.parse.urlencode({
              'faculty': 1,
              'lecturer': 21,
              'date': '2026-08-31',
          })
          request = urllib.request.Request(
              f'{base}?{params}',
              headers={'User-Agent': 'RSREU-Schedule-Android/0.2 (compatibility check)'},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              page = response.read().decode('utf-8', errors='replace')
              print('STATUS', response.status)
              print('CONTENT-TYPE', response.headers.get('Content-Type'))

          match = re.search(
              r'<table\b[^>]*table-vertical-borders[^>]*>.*?</table>',
              page,
              flags=re.S | re.I,
          )
          if not match:
              print(page[:30000])
              raise SystemExit('Schedule table not found')

          table = re.sub(r'>\s+<', '><', html.unescape(match.group(0)))
          print('TABLE HTML:')
          print(table[:30000])
          PY
